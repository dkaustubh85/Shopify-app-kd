# Deploy from this directory as the repository root. Paid resources: approve in Render first.
services:
  - type: web
    name: stocksheet-web
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: stocksheet-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_inventory,read_locations,read_products,write_inventory,write_products
      - key: WORKER_SECRET
        generateValue: true
  - type: worker
    name: stocksheet-worker
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/worker.mjs
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: WORKER_HOSTPORT
        fromService:
          name: stocksheet-web
          type: web
          property: hostport
      - key: WORKER_SECRET
        fromService:
          name: stocksheet-web
          type: web
          envVarKey: WORKER_SECRET
databases:
  - name: stocksheet-db
    plan: basic-256mb
    region: ohio
    databaseName: stocksheet
    user: stocksheet
    ipAllowList: []
