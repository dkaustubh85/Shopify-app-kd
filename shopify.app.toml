# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fe6a76a80017a63cbc948eed99d2f5c9"
application_url = "https://stocksheet-web.onrender.com"
embedded = true
name = "StockSheet"

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_products,write_inventory,write_products"

[auth]
redirect_urls = [
  "https://stocksheet-web.onrender.com/auth/callback",
  "https://stocksheet-web.onrender.com/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = false

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"
[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"
[[webhooks.subscriptions]]
topics = ["products/update", "products/create", "products/delete", "inventory_levels/update", "inventory_items/update"]
uri = "/webhooks/inventory"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/privacy"
