services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: file:/data/stocksheet.sqlite
    volumes: ["inventory:/data"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
  worker:
    build: .
    env_file: .env
    environment:
      WORKER_URL: http://web:3000/worker
    command: ["node", "scripts/worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  inventory:
